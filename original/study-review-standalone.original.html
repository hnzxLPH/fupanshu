<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习复盘小站</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #FFF8F3;
            --peach: #FFD6C9;
            --lavender: #E8D5F2;
            --mint: #D4F1E8;
            --butter: #FFF4D6;
            --dark: #2C2C2C;
            --text: #5A5A5A;
            --border: #F0E6DC;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, #FFF5EB 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            background: rgba(255, 248, 243, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar-brand::before {
            content: "📚";
            font-size: 1.8rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: var(--peach);
            color: var(--dark);
        }

        /* ===== 容器 ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ===== 页面 ===== */
        .page {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 首页 ===== */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            padding: 3rem 2rem;
            background: linear-gradient(135deg, rgba(255, 214, 201, 0.3) 0%, rgba(232, 213, 242, 0.3) 100%);
            border-radius: 30px;
            border: 2px dashed var(--border);
        }

        .hero-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .hero-slogan {
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 1.5rem;
            font-style: italic;
            opacity: 0.9;
        }

        .hero-desc {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 2rem;
        }

        /* ===== 上传区域 ===== */
        .upload-section {
            background: white;
            border-radius: 25px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 2px solid var(--border);
        }

        .upload-section h2 {
            color: var(--dark);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .upload-hint {
            color: var(--text);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        .upload-box {
            border: 3px dashed var(--peach);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, rgba(255, 214, 201, 0.1) 0%, rgba(255, 244, 214, 0.1) 100%);
        }

        .upload-box:hover {
            border-color: var(--lavender);
            background: linear-gradient(135deg, rgba(232, 213, 242, 0.1) 0%, rgba(255, 244, 214, 0.1) 100%);
            transform: translateY(-2px);
        }

        .upload-box-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .upload-box-text {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .upload-box-format {
            font-size: 0.85rem;
            color: var(--text);
            opacity: 0.7;
        }

        #fileInput {
            display: none;
        }

        /* ===== 记录卡片 ===== */
        .records-section {
            margin-top: 2rem;
        }

        .records-title {
            color: var(--dark);
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .records-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .record-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .record-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--peach), var(--lavender), var(--mint));
        }

        .record-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .record-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark);
            flex: 1;
            word-break: break-word;
        }

        .record-date {
            font-size: 0.85rem;
            color: var(--text);
            opacity: 0.7;
            margin-top: 0.3rem;
        }

        .record-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(255, 214, 201, 0.1) 0%, rgba(232, 213, 242, 0.1) 100%);
            border-radius: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text);
            opacity: 0.7;
            margin-top: 0.3rem;
        }

        .record-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--peach), var(--lavender));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 214, 201, 0.4);
        }

        .btn-secondary {
            background: var(--butter);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: var(--mint);
        }

        .btn-danger {
            background: #FFE0E0;
            color: #C84C4C;
        }

        .btn-danger:hover {
            background: #FFD0D0;
        }

        /* ===== 数据看板 ===== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 2px solid var(--border);
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 1.5rem;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* ===== 记录详情 ===== */
        .detail-header {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 2px solid var(--border);
        }

        .detail-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .detail-meta {
            color: var(--text);
            opacity: 0.7;
            font-size: 0.95rem;
        }

        .detail-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
            overflow-x: auto;
        }

        .tab-btn {
            padding: 1rem 1.5rem;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--dark);
            border-bottom-color: var(--peach);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .daily-item {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .daily-item:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .daily-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .daily-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
        }

        .daily-toggle {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .daily-item.expanded .daily-toggle {
            transform: rotate(180deg);
        }

        .daily-content {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid var(--border);
        }

        .daily-item.expanded .daily-content {
            display: block;
        }

        .subject-block {
            background: linear-gradient(135deg, rgba(255, 214, 201, 0.1) 0%, rgba(232, 213, 242, 0.1) 100%);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .subject-name {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .subject-detail {
            font-size: 0.9rem;
            color: var(--text);
            margin-bottom: 0.3rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text);
            opacity: 0.7;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* ===== 浮动装饰 ===== */
        .floating-decor {
            position: fixed;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
        }

        .decor-1 {
            background: var(--peach);
            top: 10%;
            right: 5%;
            animation: float 6s ease-in-out infinite;
        }

        .decor-2 {
            background: var(--lavender);
            bottom: 20%;
            left: 5%;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1rem;
                width: 100%;
                justify-content: center;
            }

            .hero h1 {
                font-size: 1.8rem;
            }

            .records-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 1rem;
            }

            .tabs {
                gap: 0.5rem;
            }

            .tab-btn {
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
            }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success {
            border-left: 4px solid #4CAF50;
            color: #2E7D32;
        }

        .toast.error {
            border-left: 4px solid #F44336;
            color: #C62828;
        }
    </style>
</head>
<body>
    <!-- 浮动装饰 -->
    <div class="floating-decor decor-1"></div>
    <div class="floating-decor decor-2"></div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">学习复盘小站</div>
        <ul class="nav-links">
            <li><a onclick="switchPage('home')" class="nav-link active">首页</a></li>
            <li><a onclick="switchPage('dashboard')" class="nav-link">数据看板</a></li>
        </ul>
    </nav>

    <!-- 首页 -->
    <div id="home" class="page active">
        <div class="container">
            <div class="hero">
                <div class="hero-icon">📖</div>
                <h1>学习复盘小站</h1>
                <div class="hero-slogan" id="slogan">"复盘不是为了后悔，而是为了更好地出发"</div>
                <p class="hero-desc">上传你的高考复盘本，自动生成学习数据分析</p>
            </div>

            <div class="upload-section">
                <h2>📤 上传复盘文件</h2>
                <p class="upload-hint">支持 2026高考复盘本 固定格式 Excel 文件</p>
                <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-box-icon">📁</div>
                    <div class="upload-box-text">点击或拖拽上传复盘文件</div>
                    <div class="upload-box-format">支持 .xlsx / .xls / .csv 格式</div>
                </div>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="handleFileUpload(event)">
            </div>

            <div class="records-section">
                <div class="records-title">📋 复盘记录 <span id="recordCount">0</span> 条</div>
                <div id="recordsContainer" class="records-grid"></div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📭</div>
                    <p>还没有上传任何复盘记录，快来上传吧！</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 数据看板 -->
    <div id="dashboard" class="page">
        <div class="container">
            <h1 style="color: var(--dark); margin-bottom: 2rem; font-size: 2rem;">📊 数据看板</h1>
            <div id="dashboardContent" class="dashboard-grid"></div>
            <div id="dashboardEmpty" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📊</div>
                <p>还没有数据，请先上传复盘文件</p>
            </div>
        </div>
    </div>

    <!-- 记录详情 -->
    <div id="detail" class="page">
        <div class="container">
            <button onclick="switchPage('home')" class="btn btn-secondary" style="margin-bottom: 1rem; width: auto;">← 返回记录列表</button>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        // ===== 全局状态 =====
        let allRecords = [];
        let currentRecord = null;
        let currentPage = 'home';

        // ===== 励志标语 =====
        const SLOGANS = [
            "每一次复盘，都是在为未来的自己铺路",
            "今天多翻一页书，明天少走一段弯路",
            "不怕慢，只怕站；不怕错，只怕不改",
            "把每一个知识漏洞都当成进步的阶梯",
            "坚持复盘的人，运气不会太差",
            "学习不是百米冲刺，而是一场马拉松",
            "错题本里藏着你最大的提分空间",
            "今天的汗水，是明天的底气",
            "每天进步一点点，积累起来就是质的飞跃",
            "知道自己哪里不会，就已经赢了一半",
            "复盘不是为了后悔，而是为了更好地出发",
            "你现在的努力，都在悄悄为你积攒实力",
            "把薄弱变成强项，这就是逆袭的秘密",
            "最好的学习方法，就是学完之后教给自己",
            "别和别人比进度，和昨天的自己比就好",
            "高考不是终点，而是你证明自己的起点",
            "每一道错题都在告诉你：这里还有提升空间",
            "自律的人不一定成功，但成功的人一定自律",
            "今天觉得难的题，考场上就是你的得分点",
            "学习的路上没有捷径，但有方法",
            "你不需要很厉害才能开始，但你需要开始才能很厉害",
            "星光不负赶路人，时光不负有心人",
            "把焦虑转化为行动，把迷茫转化为计划",
            "每一次认真的复盘，都值得被自己表扬",
            "慢慢来，比较快"
        ];

        // ===== 初始化 =====
        function init() {
            loadRecords();
            displaySlogan();
            setupDragDrop();
        }

        function displaySlogan() {
            const slogan = SLOGANS[Math.floor(Math.random() * SLOGANS.length)];
            document.getElementById('slogan').textContent = `"${slogan}"`;
        }

        // ===== 拖拽上传 =====
        function setupDragDrop() {
            const uploadBox = document.querySelector('.upload-box');
            uploadBox.addEventListener('dragover', e => {
                e.preventDefault();
                uploadBox.style.borderColor = 'var(--lavender)';
            });
            uploadBox.addEventListener('dragleave', () => {
                uploadBox.style.borderColor = 'var(--peach)';
            });
            uploadBox.addEventListener('drop', e => {
                e.preventDefault();
                uploadBox.style.borderColor = 'var(--peach)';
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFileUpload({ target: { files } });
                }
            });
        }

        // ===== 文件上传处理 =====
        async function handleFileUpload(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            const file = files[0];
            try {
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data);
                const parsed = parseExcelFile(workbook, file.name);
                
                const record = {
                    id: `review_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
                    fileName: file.name,
                    uploadTime: new Date().toISOString(),
                    ...parsed
                };

                allRecords.unshift(record);
                saveRecords();
                loadRecords();
                showToast('解析成功！已保存到本地', 'success');
                document.getElementById('fileInput').value = '';
            } catch (error) {
                showToast('文件解析失败：' + error.message, 'error');
            }
        }

        // ===== Excel 解析 =====
        function parseExcelFile(workbook, fileName) {
            const dailyReviews = [];
            const weeklyReviews = [];
            const knowledgeCards = [];

            for (const sheetName of workbook.SheetNames) {
                const ws = workbook.Sheets[sheetName];
                const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });

                // 日复盘
                const dailyMatch = sheetName.match(/W(\d+)-日(\d+)/);
                if (dailyMatch) {
                    const week = parseInt(dailyMatch[1]);
                    const day = parseInt(dailyMatch[2]);
                    const daily = parseDailySheet(data, week, day);
                    dailyReviews.push(daily);
                }

                // 周汇总
                const weeklyMatch = sheetName.match(/W(\d+)-周汇总/);
                if (weeklyMatch) {
                    const week = parseInt(weeklyMatch[1]);
                    const weekly = parseWeeklySheet(data, week);
                    weeklyReviews.push(weekly);
                }

                // 知识卡片
                const cardMatch = sheetName.match(/W(\d+)-卡片(\d+)/);
                if (cardMatch) {
                    const week = parseInt(cardMatch[1]);
                    const cardIndex = parseInt(cardMatch[2]);
                    const card = parseCardSheet(data, week, cardIndex);
                    knowledgeCards.push(card);
                }
            }

            dailyReviews.sort((a, b) => a.week * 10 + a.day - (b.week * 10 + b.day));
            weeklyReviews.sort((a, b) => a.week - b.week);
            knowledgeCards.sort((a, b) => a.week * 10 + a.cardIndex - (b.week * 10 + b.cardIndex));

            return { dailyReviews, weeklyReviews, knowledgeCards };
        }

        function safeStr(val) {
            if (val === null || val === undefined) return '';
            return String(val).trim();
        }

        function safeNum(val) {
            if (val === null || val === undefined) return 0;
            const n = Number(val);
            return isNaN(n) ? 0 : n;
        }

        function parseDailySheet(data, week, day) {
            const row3 = data[2] || [];
            const date = safeStr(row3[0]);
            const totalStudyHours = safeStr(row3[2]);
            const sleepHours = safeStr(row3[3]);
            const mood = safeStr(row3[4]);

            const subjects = [];
            let totalMinutes = 0;
            const SUBJECTS = ['语文', '数学', '英语', '物理', '化学', '地理'];
            
            for (let i = 6; i <= 11; i++) {
                const row = data[i] || [];
                const duration = safeNum(row[2]);
                totalMinutes += duration;
                subjects.push({
                    subject: safeStr(row[0]) || SUBJECTS[i - 6],
                    content: safeStr(row[1]),
                    duration,
                    highlight: safeStr(row[3]),
                    problem: safeStr(row[4]),
                    note: safeStr(row[5])
                });
            }

            const knowledgeGaps = [];
            for (let i = 16; i <= 21; i++) {
                const row = data[i] || [];
                if (safeStr(row[1]) || safeStr(row[2])) {
                    knowledgeGaps.push({
                        id: safeNum(row[0]),
                        subject: safeStr(row[1]),
                        name: safeStr(row[2]),
                        coreProblem: safeStr(row[3]),
                        mastery: safeNum(row[4]),
                        needReview: safeStr(row[5])
                    });
                }
            }

            const priorities = [];
            for (let i = 24; i <= 26; i++) {
                const row = data[i] || [];
                const text = safeStr(row[0]).replace(/^[①②③]\s*[最次第]?[重三]?[要位]?[：:]\s*/, '');
                if (text) priorities.push(text);
            }

            const summaryRow = data[29] || [];
            const summary = safeStr(summaryRow[0]).replace(/^💬\s*今天最大的收获或感悟[：:]\s*/, '');

            return {
                week, day, date, totalStudyHours, sleepHours, mood,
                subjects, totalMinutes, knowledgeGaps, priorities, summary
            };
        }

        function parseWeeklySheet(data, week) {
            const row2 = data[1] || [];
            const dateRange = safeStr(row2[0]);
            const totalHours = safeStr(row2[3]);
            const avgHoursPerDay = safeStr(row2[5]);

            const knowledgeItems = [];
            for (let i = 5; i <= 22; i++) {
                const row = data[i] || [];
                if (safeStr(row[1]) || safeStr(row[2])) {
                    knowledgeItems.push({
                        id: safeNum(row[0]),
                        subject: safeStr(row[1]),
                        name: safeStr(row[2]),
                        frequency: safeNum(row[3]),
                        priority: safeStr(row[4]),
                        coreProblem: safeStr(row[5]),
                        status: safeStr(row[6])
                    });
                }
            }

            const insightRow = data[26] || [];
            const insight = safeStr(insightRow[0]).replace(/^💡\s*写下本周最重要的一个突破或领悟[：:]\s*/, '');

            const nextWeekFocus = [];
            for (let i = 29; i <= 31; i++) {
                const row = data[i] || [];
                const text = safeStr(row[0]).replace(/^[①②③]\s*[最次第]?[优三]?[先位]?[：:]\s*/, '');
                if (text) nextWeekFocus.push(text);
            }

            return { week, dateRange, totalHours, avgHoursPerDay, knowledgeItems, insight, nextWeekFocus };
        }

        function parseCardSheet(data, week, cardIndex) {
            const row5 = data[4] || [];
            const knowledgeName = safeStr(row5[1]).replace(/^📌\s*知识点名称[：:]\s*_*\s*/, '');
            const subject = safeStr(row5[5]).replace(/^科目[：:]\s*/, '');
            const date = safeStr(row5[6]).replace(/^日期[：:]\s*/, '');

            const row7 = data[6] || [];
            const coreDefinition = safeStr(row7[1]);

            const errorProne = [];
            for (let i = 9; i <= 11; i++) {
                const row = data[i] || [];
                if (safeStr(row[1]) || safeStr(row[4])) {
                    errorProne.push({
                        mistake: safeStr(row[1]),
                        correct: safeStr(row[4])
                    });
                }
            }

            const relatedTopics = [];
            for (let i = 13; i <= 17; i++) {
                const row = data[i] || [];
                const text = safeStr(row[1]).replace(/^→\s*/, '');
                if (text) relatedTopics.push(text);
            }

            const row20 = data[19] || [];
            const questionSources = safeStr(row20[1]).replace(/^题目编号\s*\/\s*来源[：:]\s*/, '');

            return { week, cardIndex, knowledgeName, subject, date, coreDefinition, errorProne, relatedTopics, questionSources };
        }

        function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {

                if (currentRecord?.id === id) {

            }

        async function exportRecord(id) {
            const record = allRecords.find(r => r.id === id);
            if (!record) return;

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                let yPosition = 20;
                const lineHeight = 7;
                const margin = 15;
                const contentWidth = pageWidth - 2 * margin;

                // 设置字体
                pdf.setFont('SimSun', 'bold');
                pdf.setFontSize(18);
                pdf.text('学习复盘记录', margin, yPosition);
                yPosition += 12;

                // 文件信息
                pdf.setFont('SimSun', 'normal');
                pdf.setFontSize(10);
                pdf.text(`文件名：${record.fileName}`, margin, yPosition);
                yPosition += lineHeight;
                pdf.text(`上传时间：${new Date(record.uploadTime).toLocaleString('zh-CN')}`, margin, yPosition);
                yPosition += lineHeight * 2;

                // 统计概览
                pdf.setFont('SimSun', 'bold');
                pdf.setFontSize(12);
                pdf.text('📊 统计概览', margin, yPosition);
                yPosition += lineHeight;

                pdf.setFont('SimSun', 'normal');
                pdf.setFontSize(10);
                const totalDays = record.dailyReviews.length;
                const totalMinutes = record.dailyReviews.reduce((sum, d) => sum + (d.totalMinutes || 0), 0);
                const totalHours = (totalMinutes / 60).toFixed(1);
                const totalGaps = record.knowledgeCards.length;

                pdf.text(`总复盘天数：${totalDays}天`, margin, yPosition);
                yPosition += lineHeight;
                pdf.text(`总学习时长：${totalHours}小时`, margin, yPosition);
                yPosition += lineHeight;
                pdf.text(`知识漏洞数：${totalGaps}个`, margin, yPosition);
                yPosition += lineHeight * 2;

                // 日复盘详情
                if (record.dailyReviews.length > 0) {
                    pdf.setFont('SimSun', 'bold');
                    pdf.setFontSize(12);
                    pdf.text('📅 每日复盘', margin, yPosition);
                    yPosition += lineHeight;

                    pdf.setFont('SimSun', 'normal');
                    pdf.setFontSize(9);

                    record.dailyReviews.forEach((day, idx) => {
                        if (yPosition > pageHeight - 20) {
                            pdf.addPage();
                            yPosition = 20;
                        }

                        pdf.setFont('SimSun', 'bold');
                        pdf.text(`第${day.week}周 · 第${day.day}天 (${day.date})`, margin, yPosition);
                        yPosition += lineHeight;

                        pdf.setFont('SimSun', 'normal');
                        pdf.text(`学习时长：${day.totalMinutes}分钟 | 睡眠：${day.sleepHours} | 心情：${day.mood}`, margin, yPosition);
                        yPosition += lineHeight;

                        if (day.subjects && day.subjects.length > 0) {
                            day.subjects.forEach(subject => {
                                if (yPosition > pageHeight - 20) {
                                    pdf.addPage();
                                    yPosition = 20;
                                }
                                const subjectText = `  ${subject.subject}：${subject.content} (${subject.duration}分钟)`;
                                pdf.text(subjectText, margin + 5, yPosition);
                                yPosition += lineHeight * 0.8;
                            });
                        }
                        yPosition += lineHeight * 0.5;
                    });
                }

                // 知识卡片
                if (record.knowledgeCards.length > 0) {
                    if (yPosition > pageHeight - 30) {
                        pdf.addPage();
                        yPosition = 20;
                    }
                    pdf.setFont('SimSun', 'bold');
                    pdf.setFontSize(12);
                    pdf.text('🎯 知识卡片', margin, yPosition);
                    yPosition += lineHeight;

                    pdf.setFont('SimSun', 'normal');
                    pdf.setFontSize(9);
                    record.knowledgeCards.forEach(card => {
                        if (yPosition > pageHeight - 20) {
                            pdf.addPage();
                            yPosition = 20;
                        }
                        pdf.text(`${card.subject} - ${card.name}`, margin, yPosition);
                        yPosition += lineHeight * 0.8;
                    });
                }

                // 保存PDF
                const fileName = `复盘记录_${record.fileName}_${new Date().toLocaleDateString('zh-CN')}.pdf`;
                pdf.save(fileName);
                showToast('导出成功！已保存为PDF格式', 'success');
            } catch (error) {
                console.error('导出失败:', error);
                showToast('导出失败，请重试', 'error');
            }
        }

        // ===== 数据看板 =====
        function renderDashboard() {
            const content = document.getElementById('dashboardContent');
            const empty = document.getElementById('dashboardEmpty');

            if (allRecords.length === 0) {
                content.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';

            // 合并所有记录数据
            let allDailyReviews = [];
            let allWeeklyReviews = [];
            let allKnowledgeCards = [];

            allRecords.forEach(record => {
                allDailyReviews = allDailyReviews.concat(record.dailyReviews);
                allWeeklyReviews = allWeeklyReviews.concat(record.weeklyReviews);
                allKnowledgeCards = allKnowledgeCards.concat(record.knowledgeCards);
            });

            // 计算统计数据
            const subjectMinutes = {};
            const dailyTrend = [];
            const gapsBySubject = {};
            const weakPoints = [];

            allDailyReviews.forEach(daily => {
                daily.subjects.forEach(s => {
                    subjectMinutes[s.subject] = (subjectMinutes[s.subject] || 0) + s.duration;
                });
                dailyTrend.push({ label: `W${daily.week}D${daily.day}`, minutes: daily.totalMinutes });
                daily.knowledgeGaps.forEach(gap => {
                    if (!gapsBySubject[gap.subject]) gapsBySubject[gap.subject] = 0;
                    gapsBySubject[gap.subject]++;
                    if (gap.mastery > 0 && gap.mastery <= 2) weakPoints.push(gap);
                });
            });

            content.innerHTML = `
                <div class="chart-card">
                    <div class="chart-title">📊 各科学习时间占比</div>
                    <div class="chart-container">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">📈 每日学习时长趋势</div>
                    <div class="chart-container">
                        <canvas id="lineChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">❌ 各科遗漏知识点</div>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">📊 统计概览</div>
                    <div style="padding: 1rem 0;">
                        <div class="subject-detail">总复盘天数：${allDailyReviews.length}天</div>
                        <div class="subject-detail">总学习时长：${(allDailyReviews.reduce((sum, d) => sum + d.totalMinutes, 0) / 60).toFixed(1)}小时</div>
                        <div class="subject-detail">总知识漏洞：${allDailyReviews.reduce((sum, d) => sum + d.knowledgeGaps.length, 0)}个</div>
                        <div class="subject-detail">薄弱知识点：${weakPoints.length}个</div>
                    </div>
                </div>
            `;

            // 绘制图表
            setTimeout(() => {
                drawPieChart(subjectMinutes);
                drawLineChart(dailyTrend);
                drawBarChart(gapsBySubject);
            }, 100);
        }

        function drawPieChart(subjectMinutes) {
            const ctx = document.getElementById('pieChart');
            if (!ctx) return;

            const labels = Object.keys(subjectMinutes);
            const data = Object.values(subjectMinutes);
            const colors = ['#FFD6C9', '#E8D5F2', '#D4F1E8', '#FFF4D6', '#FFE0D6', '#E8E8F2'];

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderColor: '#FFF8F3',
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { size: 12 }, padding: 15 } }
                    }
                }
            });
        }

        function drawLineChart(dailyTrend) {
            const ctx = document.getElementById('lineChart');
            if (!ctx) return;

            const labels = dailyTrend.map(d => d.label);
            const data = dailyTrend.map(d => d.minutes);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: '学习时长(分钟)',
                        data,
                        borderColor: '#FFD6C9',
                        backgroundColor: 'rgba(255, 214, 201, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#FFD6C9',
                        pointBorderColor: '#FFF8F3',
                        pointBorderWidth: 2,
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { display: true } },
                    scales: {
                        y: { beginAtZero: true, ticks: { font: { size: 11 } } },
                        x: { ticks: { font: { size: 11 } } }
                    }
                }
            });
        }

        function drawBarChart(gapsBySubject) {
            const ctx = document.getElementById('barChart');
            if (!ctx) return;

            const labels = Object.keys(gapsBySubject);
            const data = Object.values(gapsBySubject);
            const colors = ['#FFD6C9', '#E8D5F2', '#D4F1E8', '#FFF4D6', '#FFE0D6', '#E8E8F2'];

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: '知识漏洞数',
                        data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderColor: '#FFD6C9',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { display: true } },
                    scales: {
                        y: { beginAtZero: true, ticks: { font: { size: 11 } } },
                        x: { ticks: { font: { size: 11 } } }
                    }
                }
            });
        }

        // ===== Toast 提示 =====
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== 启动 =====
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
